<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>오늘의 할일</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <div id="storage-banner" class="banner banner--warn" role="alert" hidden>
      이 브라우저에서는 저장되지 않습니다. 페이지를 닫으면 할일이 사라집니다.
    </div>

    <div id="carry-banner" class="banner" role="region" aria-label="지난 할일 이월" hidden>
      <p id="carry-text"></p>
      <div class="banner__actions">
        <button type="button" class="btn btn--primary" data-action="carry-accept">가져오기</button>
        <button type="button" class="btn" data-action="carry-dismiss">버리기</button>
      </div>
    </div>

    <header class="header">
      <h1>오늘의 할일</h1>
      <p id="today" class="header__date"></p>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <label for="add-input" class="visually-hidden">새 할일</label>
      <input id="add-input" class="input" type="text" maxlength="200" placeholder="할 일을 입력하세요..." required>
      <button type="submit" class="btn btn--primary">추가</button>
    </form>

    <section class="progress" aria-label="진행률">
      <div class="progress__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress__fill"></div>
      </div>
      <p id="progress-text" class="progress__text" aria-live="polite"></p>
    </section>

    <nav class="filters" role="tablist" aria-label="필터">
      <button type="button" role="tab" class="filters__tab" data-filter="all">전체</button>
      <button type="button" role="tab" class="filters__tab" data-filter="active">진행중</button>
      <button type="button" role="tab" class="filters__tab" data-filter="done">완료</button>
    </nav>

    <ul id="todo-list" class="todo-list" aria-label="할일 목록"></ul>
    <div id="empty" class="empty" hidden>
      <div class="empty__icon" aria-hidden="true">📝</div>
      <p id="empty-text"></p>
    </div>

    <footer class="footer">
      <span id="remaining"></span>
      <button type="button" class="btn btn--ghost" data-action="clear-done">완료 항목 지우기</button>
    </footer>

    <p class="legend" aria-hidden="true">
      <span><i class="dot dot--high"></i>높음</span>
      <span><i class="dot dot--normal"></i>보통</span>
      <span><i class="dot dot--low"></i>낮음</span>
    </p>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button type="button" class="toast__btn" data-action="undo">되돌리기</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
